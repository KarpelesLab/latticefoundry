[package]
name = "latticefoundry"
version = "0.0.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Mark Karpeles <admin@echelle.co.jp>"]
repository = "https://github.com/KarpelesLab/latticefoundry"
description = "A clean-room compiler construction framework in pure Rust"
readme = "README.md"
keywords = ["compiler", "ssa", "codegen", "jit", "linker"]
categories = ["compilers", "development-tools"]
# lf-cc is a separate crate that lives in-tree for now.
exclude = ["/.github", "/lf-cc"]

# This is a single package, NOT a Cargo workspace: one library
# (`src/lib.rs`) plus several binaries auto-discovered from `src/bin/`
# (`lf`, `lf-ld`, `lf-as`, `lf-opt`, `lf-dis`).
[lib]
name = "latticefoundry"
path = "src/lib.rs"

# Direct dependencies are only our own focused, clean-room library crates.
# (Third-party crates may appear transitively through them — qld uses rayon,
# hashbrown and memmap2.) `z3rs` is our pure-Rust SMT solver; `puremp` is our
# arbitrary-precision numeric core (and z3rs's own dependency); `rsasm` is our
# multi-architecture assembler (behind `lf-as`); `qld` is our GNU-ld-compatible
# linker (behind `lf-ld` for ELF objects, archives and shared libraries).
[dependencies]
z3rs = "0.0.4"
puremp = "0.2"
# Only the backends for the targets LatticeFoundry has.
rsasm = { version = "0.1.3", default-features = false, features = ["x86", "aarch64", "riscv"] }
# No `plugin` feature: that is qld's only FFI (dlopen of a GCC/LLVM LTO plugin).
qld = { version = "0.1.0", default-features = false }

[lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
